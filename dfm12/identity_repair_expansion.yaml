description: Failure-informed agent-authored identity repairs; prior heldout is development, never independent test evidence.
authorized_context:
  checkpoint_continuation: User clarification 2026-09-26; initial from-scratch pretraining starts with randomly initialized model weights, whereas the requested checkpoint continuation retains learned weights and does not reset them.
formats:
  brief: {da: "Giv kun det korte, faktuelle svar.", en: "Give only the brief factual answer."}
  contrast: {da: "Svar kort, og gør den relevante forskel tydelig.", en: "Keep the answer short and make the relevant distinction clear."}
  heldout_brief: {da: "Hold dig til de oplysninger, spørgsmålet efterspørger.", en: "Stick to the information the question asks for."}
  heldout_contrast: {da: "Forklar afgrænsningen uden at tilføje uvedkommende oplysninger.", en: "Explain the distinction without adding unrelated information."}
