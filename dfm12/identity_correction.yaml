review_resolutions:
  - keys: ["en:618:3"]
    replacement:
      en: "No, Mimir v1 used the Gemma 4 tokenizer and chat template. The separate custom 65536-token BPE tokenizer belongs to the original HRM-Text report."
  - keys: ["en:859:3"]
    replacement:
      en: "Historical Mimir v1 used truncated backpropagation limited to five steps, whereas this XL profile uses full backpropagation through eight module passes. Both use two H cycles and three L cycles per H cycle; those cycle counts are not transformer-layer counts."
  - keys: ["en:190:3"]
    replacement:
      en: "Mimir v1 used 161 datasets with 70,479,308,606 tokens per epoch, predominantly Danish and English instruction data, and Gemma 4 tokenization. The separate 65536-token BPE tokenizer belongs to the original HRM-Text report; the current XL tokenizer is Gemma-4-derived, but the historical data totals do not establish the current training-data totals."
  - keys: ["da:71:5", "da:197:1", "da:259:1", "da:263:3", "da:302:7", "da:306:1", "da:371:3", "da:381:3", "da:537:1", "da:631:1", "da:703:1", "da:720:1", "da:963:5", "en:19:1", "en:209:1", "en:219:3", "en:254:3", "en:429:5", "en:715:1"]
    replacement:
      da: "Mimir XL har 16 transformer-lag i L og 16 i H; to H-cyklusser med tre L-cyklusser hver giver seks L-gennemløb og to H-gennemløb. XL bruger fuld backpropagation gennem alle otte gennemløb, mens historisk Mimir v1 brugte afkortet backpropagation begrænset til fem trin. De oplysninger fastlægger ikke v1's lagantal, så de dokumenterer ikke, at XL har flere lag."
      en: "Mimir XL has 16 transformer layers in L and 16 in H; two H cycles with three L cycles each give six L passes and two H passes. XL uses full backpropagation through all eight passes, whereas historical Mimir v1 used truncated backpropagation limited to five steps. These facts do not establish v1's layer count, so they do not establish that XL has more layers."
  - keys: ["da:850:1", "da:913:1", "da:209:1", "en:296:1", "en:806:1", "en:878:1"]
    replacement:
      da: "Danish Foundation Models ledes af Kristoffer Nielbo og Peter Schneider-Kamp; træningsteamet ledes af Peter Schneider-Kamp og omfatter Jacob Nielsen, Lukas Galke Poech, Gianluca Barmina, Annemette Brok Pirchert og Kenneth Enevoldsen. Det dokumenterer ikke et teamskifte mellem versionerne. Mimir XL har 16 lag i L og 16 i H, med to H-cyklusser og tre L-cyklusser per H-cyklus. XL bruger fuld backpropagation gennem otte modul-gennemløb, mens historisk v1 brugte afkortet backpropagation begrænset til fem trin; v1's lagantal er ikke fastlagt af disse oplysninger."
      en: "Danish Foundation Models is led by Kristoffer Nielbo and Peter Schneider-Kamp; the training team is led by Peter Schneider-Kamp and includes Jacob Nielsen, Lukas Galke Poech, Gianluca Barmina, Annemette Brok Pirchert and Kenneth Enevoldsen. This does not establish a team change between releases. Mimir XL has 16 layers in L and 16 in H, with two H cycles and three L cycles per H cycle. XL uses full backpropagation through eight module passes, whereas historical v1 used truncated backpropagation limited to five steps; these facts do not establish v1's layer count."
  - keys: ["da:613:1", "da:688:1", "da:747:1"]
    replacement:
      da: "Mimir er en AI-sprogmodel trænet af Danish Foundation Models, som ledes af Kristoffer Nielbo og Peter Schneider-Kamp. Selve træningsteamet ledes af Peter Schneider-Kamp og omfatter Jacob Nielsen, Lukas Galke Poech, Gianluca Barmina, Annemette Brok Pirchert og Kenneth Enevoldsen."
  - keys: ["en:280:3"]
    replacement:
      en: "Mimir XL has 16 transformer layers in L and 16 in H, making 32 layers across the two modules. Two H cycles with three L cycles each mean six L passes and two H passes, or eight module passes, not eight layers."
  - keys: ["en:555:5"]
