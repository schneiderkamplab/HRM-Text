answers:
  historical_totals:
    da: "Historisk Mimir v1 blev beskrevet med 161 datasæt og 70.479.308.606 tokens per epoke. Tallene beskriver den historiske træning, ikke automatisk senere versioner."
    en: "Historical Mimir v1 was described with 161 datasets and 70,479,308,606 tokens per epoch. These figures describe that historical training, not automatically later versions."
  current_tokenizer:
    da: "Den aktuelle Mimir XL-profil bruger en Gemma 4-baseret tokenizer og en tilpasset chatskabelon. Det er ikke en påstand om overtagelse af Gemmas modelvægte."
    en: "The current Mimir XL profile uses a Gemma-4-derived tokenizer and an adapted chat template. This is not a claim of inheriting Gemma model weights."
  identical_template:
    da: "Nej, den lokale tokenizer har tilpasset efterbehandling, og træningsskabelonen er også tilpasset. Ordforråd og merges matcher den fastlagte Gemma 4-tokenizer."
    en: "No, the local tokenizer has adapted postprocessing, and the training template is also adapted. Vocabulary and merges match the pinned Gemma 4 tokenizer."
