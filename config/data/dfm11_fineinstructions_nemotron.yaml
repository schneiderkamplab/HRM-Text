seed: 110031
status: excluded
excluded_on: 2026-09-04
exclusion_reason: unresolved Common-Crawl provenance, copyright, PII, and source-copy risk

# The published score is row-aligned with each Parquet shard. The paper used
# >=4; DFM11 accepts only the highest score. Scores 1-4 are never used to fill
# an unmet token cap.
minimum_judge_score: 5
allow_lower_score_fallback: false

# Exact DFM/Gemma-rendered tokens are enforced after tokenization. This source
# token budget deliberately over-materializes by 15% to leave room for schema,
# PII, deduplication, context-length, and rendered-token filtering.
rendered_token_cap: 0
materialized_source_token_target: 0
repeat: 0

pilot_rows: 100000
output_rows_per_shard: 250000
max_answer_characters: 12000

admission:
  license_status: review_required
  pii_audit_required: true
  source_copy_audit_required: true
  benchmark_decontamination_required: true
  task_quality_audit_required: true
  approval_receipt: data/receipts/dfm11_fineinstructions_nemotron_admission.yaml

paths:
  staging: data/staging/dfm11_fineinstructions_nemotron
