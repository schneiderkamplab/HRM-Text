sets:
  hrm_danish_andersen_modernization:
    description: "Single-task HRM Danish suite: zero-shot Andersen modernization."
    tasks:
      - name: dfm_evals/andersen-modernization
        args:
          - -T
          - data_path=/work/dfm/andersen/pairs_chunked_val.jsonl
          - -T
          - max_gen_toks=1536
    args:
      - --model
      - "{{target_model}}"
      - --temperature
      - "0"

  hrm_long_context_ruler_smoke:
    description: "Long-context smoke suite: 4K RULER NIAH and variable-tracking checks."
    tasks:
      - name: dfm_evals/ruler
        args:
          - -T
          - variant=niah_single_1
          - -T
          - num_samples=4
          - -T
          - max_seq_length=4096
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - context_buffer_tokens=256
      - name: dfm_evals/ruler
        args:
          - -T
          - variant=vt
          - -T
          - num_samples=4
          - -T
          - max_seq_length=4096
          - -T
          - tokenizer_backend=auto
          - -T
          - tokenizer_model={{target_model}}
          - -T
          - context_buffer_tokens=256
    args:
      - --model
      - "{{target_model}}"
      - --temperature
      - "0"

  hrm_long_context_ruler_8k:
    description: "Full 8K RULER suite: 13 variants with 32 deterministic samples each."
    tasks:
      - name: dfm_evals/ruler
        args: [-T, variant=niah_single_1]
      - name: dfm_evals/ruler
        args: [-T, variant=niah_single_2]
      - name: dfm_evals/ruler
        args: [-T, variant=niah_single_3]
      - name: dfm_evals/ruler
        args: [-T, variant=niah_multikey_1]
      - name: dfm_evals/ruler
        args: [-T, variant=niah_multikey_2]
      - name: dfm_evals/ruler
        args: [-T, variant=niah_multikey_3]
      - name: dfm_evals/ruler
        args: [-T, variant=niah_multivalue]
      - name: dfm_evals/ruler
        args: [-T, variant=niah_multiquery]
      - name: dfm_evals/ruler
        args: [-T, variant=vt]
      - name: dfm_evals/ruler
        args: [-T, variant=cwe]
      - name: dfm_evals/ruler
        args: [-T, variant=fwe]
      - name: dfm_evals/ruler
        args: [-T, variant=qa_1]
      - name: dfm_evals/ruler
        args: [-T, variant=qa_2]
    args:
      - --model
      - "{{target_model}}"
      - --temperature
      - "0"
      - -T
      - num_samples=32
      - -T
      - max_seq_length=8192
      - -T
      - context_buffer_tokens=256

  hrm_danish_danish_citizen_tests:
    description: "Single-task HRM Danish suite: Danish citizen tests."
    tasks:
      - name: dfm_evals/danish-citizen-tests
        args:
          - -T
          - dataset_id=alexandrainst/danish-citizen-tests
    args:
      - --model
      - "{{target_model}}"
      - --sample-shuffle
      - "4242"
      - --temperature
      - "0"

