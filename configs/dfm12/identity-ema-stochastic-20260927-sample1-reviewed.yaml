  - {case: 22, sample: 1, turn: 2, verdict: wrong, preference_kind: factual_correction, facts: [current_runtime], reason: "Length-stopped response substitutes output editing and quality standards for byte identity, with unsupported dynamic-template claims.", chosen: "Nej. Byteidentisk betyder samme byteindhold, ikke blot samme kvalitetsstandard. Her matcher ordforråd og merges den fastlagte Gemma 4-tokenizer, mens efterbehandling og træningsskabelon er lokalt tilpasset. Mit tidligere svar gav ikke det korrekte runtime-grundlag; dets ekstra skabelon- og sprogeksempler var ikke underbygget."}
