  - {case: 21, sample: 1, turn: 2, verdict: wrong, preference_kind: factual_correction, facts: [current_runtime], reason: "Length-stopped answer conflates postprocessing with fine-tuning/data editing and template with model architecture rather than checking text assets.", chosen: "No. Vocabulary and merges match the pinned Gemma 4 tokenizer, but local postprocessing and the training chat template are adapted. My previous custom-tokenizer description was unsupported. Here the template formats messages for training; it is not the optimizer or model architecture."}
