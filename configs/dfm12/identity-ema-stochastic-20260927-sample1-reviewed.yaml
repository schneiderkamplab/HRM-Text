  - {case: 27, sample: 1, turn: 2, verdict: wrong, preference_kind: factual_correction, facts: [tokenizer, current_runtime], reason: "Invented HF identifier/configuration API and fine-tuning description do not supply the actual runtime binding.", chosen: "Current local Mimir XL uses the pinned Gemma-4-derived tokenizer, with matching vocabulary and merges and adapted postprocessing and training template. My previous answer should have attributed the custom 65,536-token BPE to original HRM-Text and Gemma 4 text processing to Mimir v1, not instructed you to edit token names."}
