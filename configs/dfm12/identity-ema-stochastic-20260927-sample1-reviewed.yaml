  - {case: 15, sample: 1, turn: 1, verdict: partial, preference_kind: precision, facts: [tokenizer], reason: "Main tokenizer-versus-weights distinction is correct. Prefer avoiding ambiguous base-model terminology and an architecture comparison not established by tokenizer reuse; not a demonstrated wrong-origin claim.", reuse_chosen: true}
